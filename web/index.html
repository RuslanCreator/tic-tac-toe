<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики DDD</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --text-muted: #95a5a6;
            --border-color: #3f3f3f;
            --danger-color: #e74c3c;
        }
    
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    
        /* Шапка приложения */
        header {
            background-color: var(--panel-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    
        .nav-auth {
            display: flex;
            align-items: center;
            gap: 15px;
        }
    
        /* Кнопки */
        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
    
        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    
        button.btn-secondary {
            background-color: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
        }
    
        button.btn-secondary:hover {
            border-color: var(--accent-color);
        }
    
        button.btn-danger {
            background-color: var(--danger-color);
        }
    
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            background: rgba(0, 173, 181, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 173, 181, 0.3);
        }
    
        /* Контентная зона (SPA экраны) */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
    
        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-align: center;
        }
    
        .screen.active {
            display: block;
        }
    
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
    
        .menu-buttons button {
            padding: 14px;
            font-size: 18px;
        }
    
        /* Модальные окна (Регистрация / Вход) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    
        .modal {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            border: 1px solid var(--border-color);
        }
    
        .modal h2 {
            margin-bottom: 20px;
            color: var(--accent-color);
        }
    
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 22px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }
    
        /* Формы ввода */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
    
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-muted);
        }
    
        .form-group input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
    
        .form-group input:focus {
            border-color: var(--accent-color);
            outline: none;
        }
    
        /* Список Лобби (Выпадашка/Дропдаун под кнопкой) */
        .lobby-dropdown-container {
            position: relative;
            display: inline-block;
        }
    
        .lobby-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: none;
            z-index: 500;
        }
    
        .lobby-dropdown.show {
            display: block;
        }
    
        .lobby-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
    
        .lobby-item:hover {
            background-color: rgba(255,255,255,0.03);
        }
    
        .lobby-item span {
            font-size: 14px;
        }
    
        .no-lobbies {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
    
        /* Игровое поле */
        .game-info {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
            justify-content: center;
            margin: 20px auto;
        }
    
        .cell {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
    
        .cell:hover {
            border-color: var(--accent-color);
            background-color: rgba(0, 173, 181, 0.05);
        }
    
        .cell.X { color: #e74c3c; }
        .cell.O { color: #3498db; }
    </style>
</head>
<body>
        <!-- Шапка -->
    <header>
        <div class="logo">Крестики Нолики</div>
        
        <div class="nav-auth" id="nav-auth-zone">
            <!-- Сюда динамически рендерится состояние авторизации через JS -->
        </div>
    </header>

    <!-- Основная SPA зона -->
    <main>
        <!-- Экран приветствия (Если не авторизован) -->
        <div id="welcome-screen" class="screen active">
            <h2>Добро пожаловать в игру!</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">Для начала игры, пожалуйста, авторизуйтесь или создайте новый аккаунт.</p>
        </div>

        <!-- Главное меню (Если авторизован) -->
        <div id="main-menu-screen" class="screen">
            <h2>Игровое Меню</h2>
            <div class="menu-buttons">
                <button onclick="createGame('pve')">🤖 Играть против Бота (PvE)</button>
                <button onclick="createGame('pvp')">⚔️ Создать PvP Лобби</button>
            </div>
        </div>

        <!-- Игровой экран (Для активного матча или ожидания гостя) -->
        <div id="game-screen" class="screen">
            <h2 id="game-title">Комната игры</h2>
            <div class="game-info" id="game-status-text">Ожинение соперника...</div>
            
            <div class="board" id="game-board">
                <div class="cell" onclick="cellClick(0, 0)"></div>
                <div class="cell" onclick="cellClick(0, 1)"></div>
                <div class="cell" onclick="cellClick(0, 2)"></div>
                <div class="cell" onclick="cellClick(1, 0)"></div>
                <div class="cell" onclick="cellClick(1, 1)"></div>
                <div class="cell" onclick="cellClick(1, 2)"></div>
                <div class="cell" onclick="cellClick(2, 0)"></div>
                <div class="cell" onclick="cellClick(2, 1)"></div>
                <div class="cell" onclick="cellClick(2, 2)"></div>
            </div>

            <div style="margin-top: 25px;">
                <button class="btn-danger" id="leave-btn" onclick="leaveMatch()">🏳️ Покинуть игру / Удалить лобби</button>
            </div>
        </div>
    </main>

    <!-- Окно Авторизации -->
    <div id="login-modal" class="modal-overlay" onclick="closeModal('login-modal')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal('login-modal')">&times;</button>
            <h2>Авторизация</h2>
            <form id="login-form" onsubmit="handleAuth(event, '/auth/login')">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" name="login" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" style="width: 100%; padding: 12px; margin-top: 10px;">Войти</button>
            </form>
        </div>
    </div>

    <!-- Окно Регистрации -->
    <div id="register-modal" class="modal-overlay" onclick="closeModal('register-modal')">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal('register-modal')">&times;</button>
            <h2>Регистрация</h2>
            <form id="register-form" onsubmit="handleAuth(event, '/auth/signup')">
                <div class="form-group">
                    <label>Придумайте Логин</label>
                    <input type="text" name="login" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Придумайте Пароль</label>
                    <input type="password" name="password" required autocomplete="new-password">
                </div>
                <button type="submit" style="width: 100%; padding: 12px; margin-top: 10px; background-color: #2ecc71;">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script>
        // Глобальное состояние SPA (теперь восстанавливается из памяти браузера)
        let currentUser = localStorage.getItem('tic_tac_user') || null;       
        let currentAuthHeader = localStorage.getItem('tic_tac_auth') || null; 
        let currentGameId = null;     
        let currentGameMode = null;   
        let currentBoardCells = ["", "", "", "", "", "", "", "", ""];   
        let wsConnection = null;      
    
        // Авто-запуск при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            renderHeader(); // Если в localStorage были данные, пользователь сразу окажется в меню!
            
            window.addEventListener('click', (e) => {
                const dropdown = document.getElementById('lobby-dropdown');
                if (dropdown && !e.target.closest('.lobby-dropdown-container')) {
                    dropdown.classList.remove('show');
                }
            });
        });
    
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active');
        }
    
        function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
    
        function toggleLobbyDropdown() {
            const dropdown = document.getElementById('lobby-dropdown');
            dropdown.classList.toggle('show');
            if (dropdown.classList.contains('show')) {
                loadWaitingLobbies();
            }
        }
    
        function renderHeader() {
            const container = document.getElementById('nav-auth-zone');
            if (!currentUser) {
                container.innerHTML = `
                    <button class="btn-secondary" onclick="openModal('login-modal')">Войти</button>
                    <button onclick="openModal('register-modal')">Регистрация</button>
                `;
                showScreen('welcome-screen');
            } else {
                container.innerHTML = `
                    <div class="lobby-dropdown-container">
                        <button class="btn-secondary" onclick="toggleLobbyDropdown()">🌐 Lobbies</button>
                        <div class="lobby-dropdown" id="lobby-dropdown"></div>
                    </div>
                    <div class="user-badge">👤 ${currentUser}</div>
                    <button class="btn-danger" onclick="logout()">Выйти</button>
                    <button class="btn-secondary" onclick="showScreen('main-menu-screen')">Главная</button>
                `;
                showScreen('main-menu-screen');
            }
        }
    
        async function handleAuth(event, url) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const login = formData.get('login');
            const password = formData.get('password');

            // 🚀 ТЕПЕРЬ ВСЕ ЗАПРОСЫ (И ВХОД, И РЕГИСТРАЦИЯ) ШЛЮТ JSON В BODY
            let fetchOptions = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: login, password: password })
            };

            try {
                const response = await fetch(url, fetchOptions);

                if (response.ok) {
                    const data = await response.json(); // Получаем ответ от бэкенда
                    currentUser = login;
                    
                    // Если это был логин, бэкенд вернул нам токен
                    if (url.includes('login')) {
                        // Формируем правильный заголовок Bearer для будущих запросов
                        currentAuthHeader = `Bearer ${data.access_token}`;
                        
                        // Сохраняем в localStorage имя игрока и ЕГО JWT ТОКЕН
                        localStorage.setItem('tic_tac_user', currentUser);
                        localStorage.setItem('tic_tac_auth', currentAuthHeader);
                    } else {
                        // Если это был signup, то токена еще нет (надо просто войти)
                        alert("Регистрация успешна! Теперь войдите в аккаунт.");
                        event.target.reset();
                        closeModal('register-modal');
                        return; // Прерываем, чтобы пользователь залогинился вручную
                    }

                    event.target.reset();
                    closeModal('login-modal');
                    renderHeader();
                } else {
                    const err = await response.json();
                    alert(`Ошибка: ${err.detail || 'Не удалось выполнить действие'}`);
                }
            } catch (e) {
                alert("Ошибка соединения с сервером бэкенда.");
            }
        }
    
        function logout() {
            currentUser = null;
            currentAuthHeader = null;
            currentGameId = null;
            // Очищаем кэш браузера при выходе
            localStorage.removeItem('tic_tac_user');
            localStorage.removeItem('tic_tac_auth');
            if (wsConnection) wsConnection.close();
            renderHeader();
        }
    
        async function loadWaitingLobbies() {
            const dropdown = document.getElementById('lobby-dropdown');
            try {
                const response = await fetch('/game/open_lobby', {
                    headers: { 'Authorization': currentAuthHeader }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (!data.sessions || data.sessions.length === 0) {
                        dropdown.innerHTML = `<div class="no-lobbies">Нет доступных комнат.</div>`;
                        return;
                    }
                    dropdown.innerHTML = data.sessions.map(lobby => `
                        <div class="lobby-item">
                            <span>Хост: <b>${lobby.creator_login}</b></span>
                            <button onclick="joinLobby('${lobby.game_session_id}')">Войти</button>
                        </div>
                    `).join('');
                }
            } catch (e) {
                dropdown.innerHTML = `<div class="no-lobbies" style="color: var(--danger-color)">Ошибка загрузки комнат.</div>`;
            }
        }
    
        async function createGame(mode) {
            currentGameMode = mode;
            const url = mode === 'pve' ? '/game/new/pve' : '/game/new/pvp';
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': currentAuthHeader }
                });
                if (response.ok) {
                    const gameData = await response.json();
                    initGameSession(gameData, mode);
                }
            } catch (e) {
                alert("Ошибка при создании игры.");
            }
        }
    
        async function joinLobby(gameSessionId) {
            currentGameMode = 'pvp';
            try {
                const response = await fetch(`/game/${gameSessionId}/join`, {
                    method: 'POST',
                    headers: { 'Authorization': currentAuthHeader }
                });
                if (response.ok) {
                    const fakeGameData = { id: gameSessionId };
                    document.getElementById('lobby-dropdown').classList.remove('show');
                    initGameSession(fakeGameData, 'pvp');
                } else {
                    const err = await response.json();
                    alert(err.detail || "Не удалось подключиться.");
                }
            } catch (e) {
                alert("Ошибка при входе в лобби.");
            }
        }
    
        function initGameSession(gameData, mode) {
            if (!gameData) return;
            
            // ПРАВКА: Ищем ID в любых возможных полях (id, game_session_id, gameSessionId)
            currentGameId = gameData.id || gameData.game_session_id || gameData.gameSessionId;
            currentGameMode = mode;
            
            if (!currentGameId) {
                console.error("КРИТИЧЕСКАЯ ОШИБКА: Бэкенд не прислал ID сессии матча!", gameData);
                alert("Ошибка инициализации игры: не найден ID сессии.");
                return;
            }

            console.log("Успешно инициализирована сессия ID:", currentGameId);
            showScreen('game-screen');
            updateBoardUI(gameData);
            
            if (wsConnection) wsConnection.close();

            // 🚀 ДОБАВЛЕНО: Извлекаем чистую строку JWT-токена из "Bearer <токен>"
            let rawToken = "";
            if (currentAuthHeader && currentAuthHeader.startsWith("Bearer ")) {
                rawToken = currentAuthHeader.split(' ')[1];
            }

            const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            
            // 🚀 МОДИФИЦИРОВАНО: Дописываем токен в самый конец URL-строки параметров (?token=...)
            const wsUrl = `${wsProtocol}${window.location.host}/game/${currentGameId}/ws?token=${encodeURIComponent(rawToken)}`;
            
            wsConnection = new WebSocket(wsUrl);
            
            wsConnection.onopen = () => {
                console.log("Канал вебсокета успешно открыт для ID:", currentGameId);
            };

            wsConnection.onmessage = (event) => {
                const messageData = JSON.parse(event.data);
                if (messageData.type === 'GAME_DELETED') {
                    alert(messageData.detail);
                    cleanupGameSession();
                    return;
                }
                if (messageData.status || messageData.board || messageData.cells) {
                    updateBoardUI(messageData);
                }
            };

            wsConnection.onclose = () => { console.log("Канал вебсокета закрыт."); };
        }

        function updateBoardUI(gameData) {
            if (!gameData || (!gameData.board && !gameData.cells)) {
                console.log("Ожидаем полной структуры данных от веб-сокета...");
                return;
            }

            console.log("=== ПОЛУЧЕНЫ ДАННЫЕ ИГРЫ ===", gameData);
            
            const statusText = document.getElementById('game-status-text');
            const cells = document.querySelectorAll('.cell');

            // 1. Вытаскиваем массив клеток
            let rawCells = [];
            if (gameData.board && Array.isArray(gameData.board.cells)) {
                rawCells = gameData.board.cells;
            } else if (Array.isArray(gameData.board)) {
                rawCells = gameData.board;
            } else if (gameData.cells && Array.isArray(gameData.cells)) {
                rawCells = gameData.cells;
            }

            // 2. 🚀 СИНХРОНИЗАЦИЯ: Сохраняем в currentBoardCells строго СТРОКИ ('X', 'O', '')
            // Теперь cellClick автоматически будет отправлять то, что требует Pydantic!
            currentBoardCells = rawCells.map(val => {
                const strVal = String(val).toUpperCase().trim();
                if (val === 1 || strVal === '1' || strVal === 'X') return 'X';
                if (val === 2 || strVal === '2' || strVal === 'O' || strVal === '0') return 'O';
                return ''; 
            }); 

            // 3. Обработка технического статуса
            const currentStatus = String(gameData.status || '').toUpperCase();
            if (currentStatus === 'WAITING') {
                document.getElementById('game-title').innerText = "Лобби создано";
            } else {
                document.getElementById('game-title').innerText = currentGameMode === 'pve' ? "Матч против Бота" : "PvP Матч";
            }

            // 4. Отображаем текстовый статус
            if (gameData.status_text) {
                statusText.innerText = gameData.status_text;
            } else {
                if (currentStatus === 'WAITING') statusText.innerText = "Ожидание второго игрока...";
                else if (currentStatus === 'TURN_X') statusText.innerText = "Ход: Крестики (Х)";
                else if (currentStatus === 'TURN_O') statusText.innerText = "Ход: Нолики (О)";
                else if (currentStatus === 'WON_X') statusText.innerText = "🎉 Победа Крестиков (Х)!";
                else if (currentStatus === 'WON_O') statusText.innerText = "🎉 Победа Ноликов (О)!";
                else if (currentStatus === 'DRAW') statusText.innerText = "🤝 Ничья!";
            }

            // 5. Отрисовка в HTML на основе строк
            cells.forEach((cell, index) => {
                const val = currentBoardCells[index]; // Здесь теперь лежит 'X', 'O' или ''
                cell.className = 'cell'; 
                
                if (val === 'X') { 
                    cell.innerText = 'X'; 
                    cell.classList.add('X'); 
                } else if (val === 'O') { 
                    cell.innerText = 'O'; 
                    cell.classList.add('O'); 
                } else { 
                    cell.innerText = ''; 
                }
            });
        }


        async function cellClick(row, col) {
            if (!currentGameId) {
                console.error("cellClick: currentGameId отсутствует!");
                return;
            }
            
            const url = `/game/${currentGameId}/move/${currentGameMode}`;

            const movePayload = {
                row: parseInt(row),
                col: parseInt(col),
            };

            console.log(`Отправка хода на ${url}`, movePayload);

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': currentAuthHeader // Наш Bearer JWT токен
                    },
                    body: JSON.stringify(movePayload)
                });

                if (response.ok) {
                    if (currentGameMode === 'pve') {
                        const gameData = await response.json();
                        updateBoardUI(gameData);
                        console.log("PvE ход успешно отрисован из HTTP ответа.");
                    } else {
                        console.log("PvP ход принят сервером, ожидаем обновление от сокета...");
                    }
                } else {
                    const err = await response.json();
                    alert(err.detail || "Невалидный ход!");
                }
            } catch (e) {
                console.error("Ошибка при отправке HTTP запроса хода:", e);
            }
        }


        // Фикс удаления сессии / выхода из лобби
        async function leaveMatch() {
            if (!currentGameId) {
                console.error("leaveMatch: Невозможно выйти, так как currentGameId равен null или undefined");
                return;
            }
            
            if (!confirm("Вы уверены, что хотите выйти? Если вы хост, лобби удалится из базы данных!")) return;

            const url = `/game/${currentGameId}/del`;
            console.log("Отправка запроса на принудительное удаление сессии по адресу:", url);

            try {
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: { 'Authorization': currentAuthHeader }
                });

                if (response.ok) {
                    console.log("Бэкенд успешно удалил сессию (204 No Content)");
                    cleanupGameSession();
                    alert("Вы успешно покинули и расформировали сессию.");
                } else {
                    const errData = await response.json().catch(() => ({}));
                    console.warn("Сервер отклонил удаление базы (вероятно, вы гость, а не хост):", errData);
                    cleanupGameSession(); // Гостя просто выбрасываем в меню
                }
            } catch (e) {
                console.error("Сетевая ошибка при попытке выполнить DELETE запрос удаления:", e);
                cleanupGameSession();
            }
        }

        function cleanupGameSession() {
            currentGameId = null;
            currentGameMode = null;
            
            if (wsConnection) {
                wsConnection.close();
                wsConnection = null;
            }
            
            showScreen('main-menu-screen');
        }

    </script>
</body>
